name: Feature request
description: Suggest a new capability or a change to existing behaviour.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Requests that start from a concrete problem are the easiest to evaluate, so describe what you are trying to do before proposing how.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I have searched the open and closed issues, and this has not been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it difficult or impossible today?
      placeholder: When a request times out, there is no way to tell whether the server received it, so I cannot decide safely whether to retry.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Include an example of the API, command or configuration if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or considered, and why they are not enough.
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Effect on existing users
      description: How would this change affect people who already use the project?
      options:
        - No change for existing users
        - Adds an option or a new behaviour that is off by default
        - Changes existing behaviour, and may be a breaking change
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a pull request for this, once the approach is agreed.
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as links to related issues, similar features in other projects, or sketches.
    validations:
      required: false
